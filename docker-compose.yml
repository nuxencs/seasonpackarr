services:
  seasonpackarr:
    container_name: seasonpackarr
    image: ghcr.io/nuxencs/seasonpackarr
    restart: unless-stopped
    user: ${PUID}:${PGID} #UID and GID
    ports:
      - "127.0.0.1:42069:42069"
    environment:
      # Core settings
      SEASONPACKARR__DISABLE_CONFIG_FILE: false # set to true to not rely on config.yaml
      SEASONPACKARR__HOST: 0.0.0.0
      SEASONPACKARR__PORT: 42069
      SEASONPACKARR__API_TOKEN:

      # Logging settings
      SEASONPACKARR__LOG_LEVEL: DEBUG
      SEASONPACKARR__LOG_PATH:
      SEASONPACKARR__LOG_MAX_SIZE: 50
      SEASONPACKARR__LOG_MAX_BACKUPS: 3

      # Feature settings
      SEASONPACKARR__SMART_MODE: false
      SEASONPACKARR__SMART_MODE_THRESHOLD: 0.75

      # Fuzzy matching settings
      SEASONPACKARR__FUZZY_MATCHING_SKIP_REPACK_COMPARE: false
      SEASONPACKARR__FUZZY_MATCHING_SIMPLIFY_HDR_COMPARE: false
      SEASONPACKARR__FUZZY_MATCHING_SIMPLIFY_WEB_COMPARE: false
      SEASONPACKARR__FUZZY_MATCHING_SKIP_YEAR_COMPARE: false

      # Notification settings
      SEASONPACKARR__NOTIFICATIONS_DISCORD:
      SEASONPACKARR__NOTIFICATIONS_SHOUTRRR: # Shoutrrr URLs separated by spaces
      SEASONPACKARR__NOTIFICATIONS_NOTIFICATION_LEVEL: MATCH,ERROR

      # Client settings (can have multiple clients by changing DEFAULT to another name)
      SEASONPACKARR__CLIENTS_DEFAULT_TYPE: qbittorrent # "qbittorrent", "transmission", "deluge-v1", or "deluge-v2"
      SEASONPACKARR__CLIENTS_DEFAULT_HOST: 127.0.0.1
      SEASONPACKARR__CLIENTS_DEFAULT_PORT: 8080
      SEASONPACKARR__CLIENTS_DEFAULT_USERNAME: admin
      SEASONPACKARR__CLIENTS_DEFAULT_PASSWORD: adminadmin
      SEASONPACKARR__CLIENTS_DEFAULT_APIKEY:

      # Import policy (how /api/import re-imports the season pack into the client)
      SEASONPACKARR__CLIENTS_DEFAULT_IMPORT_SAVE_PATH: # final import destination; required for qBittorrent unless IMPORT_CATEGORY is set
      SEASONPACKARR__CLIENTS_DEFAULT_IMPORT_CATEGORY: # qBittorrent only
      SEASONPACKARR__CLIENTS_DEFAULT_IMPORT_TAGS: seasonpackarr
      # SEASONPACKARR__CLIENTS_DEFAULT_IMPORT_DOWNLOAD_PATH: # qBittorrent only
      # SEASONPACKARR__CLIENTS_DEFAULT_IMPORT_CONTENT_LAYOUT: subfolder # qBittorrent only

      # Inventory scope (qBittorrent only; empty reads every torrent)
      # SEASONPACKARR__CLIENTS_DEFAULT_INVENTORY_INCLUDE_CATEGORIES: tv-hd,tv-hd-completed
      # SEASONPACKARR__CLIENTS_DEFAULT_INVENTORY_INCLUDE_TAGS:
      # SEASONPACKARR__CLIENTS_DEFAULT_INVENTORY_EXCLUDE_CATEGORIES: movies
      # SEASONPACKARR__CLIENTS_DEFAULT_INVENTORY_EXCLUDE_TAGS:

      # Source folders (absolute paths, comma-separated; see docs/CONFIGURATION.md#source-folders)
      # SEASONPACKARR__CLIENTS_DEFAULT_SOURCE_FOLDERS: /data/media/tv
      # Time between two scans of the source folders, at least 1m
      # SEASONPACKARR__SOURCE_FOLDER_SCAN_INTERVAL: 15m

      # Prowlarr discovery (see docs/PROWLARR.md)
      # SEASONPACKARR__SEARCH_PROWLARR_URL: http://prowlarr:9696
      # SEASONPACKARR__SEARCH_API_KEY:
      # SEASONPACKARR__SEARCH_INDEXER_IDS: # comma-separated IDs; empty selects all eligible indexers
      # SEASONPACKARR__SEARCH_RSS_INTERVAL: 0s # set to 15m to enable RSS imports; minimum 10m
      # SEASONPACKARR__SEARCH_REQUEST_INTERVAL: 10s # minimum 10s
    volumes:
      - ${DOCKERCONFDIR}/seasonpackarr:/config # location of the config file
      - /data/torrents:/data/torrents # your torrent data directory
