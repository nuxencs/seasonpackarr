name: Integration

# Runs the torrent client integration tests against real daemons through the
# harness runner. The runner owns the entries, so new entries need no change here.
on:
  push:
    branches:
      - 'develop'
    paths:
      - 'internal/torrentclient/**'
      - 'go.mod'
      - 'go.sum'
      # run.sh reads the Go test image from the release Dockerfile.
      - 'Dockerfile'
      - '.github/workflows/integration.yml'
  pull_request:
    paths:
      - 'internal/torrentclient/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.github/workflows/integration.yml'
  workflow_dispatch:
    inputs:
      full:
        description: 'Also run the middle qBittorrent versions'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup:
    name: Read entries
    runs-on: ubuntu-latest
    outputs:
      entries: ${{ steps.entries.outputs.entries }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: List entries
        id: entries
        env:
          # Empty on push and pull_request events.
          FULL: ${{ inputs.full }}
        run: |
          if [[ $FULL == true ]]; then
            entries=$(internal/torrentclient/testdata/harness/run.sh list all)
          else
            entries=$(internal/torrentclient/testdata/harness/run.sh list)
          fi
          echo "entries: ${entries}"
          echo "entries=${entries}" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.entry }}
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 30
    strategy:
      # One failed entry must not cancel the others, so a run shows every broken version.
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.setup.outputs.entries) }}
    env:
      # Compose builds through bake on the buildx builder, which can export the GHA cache.
      COMPOSE_BAKE: 'true'
      # compose.deluge.yaml reads this to turn on the GHA layer cache.
      HARNESS_GHA_CACHE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # buildx reads the cache service URL and token from the ACTIONS_* variables,
      # which run steps do not get by default.
      - name: Expose GitHub runtime
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Run harness
        env:
          ENTRY: ${{ matrix.entry }}
        run: internal/torrentclient/testdata/harness/run.sh "$ENTRY"

      - name: Upload daemon logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: daemon-logs-${{ matrix.entry }}
          path: internal/torrentclient/testdata/harness/artifacts/${{ matrix.entry }}
          # A failure before the daemons start leaves no logs.
          if-no-files-found: warn
