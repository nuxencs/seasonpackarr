name: Integration

# The harness runner owns the entries, so new entries need no change here.
# on.paths is the union of the setup job filters. Keep the lists in sync.
on:
  push:
    branches:
      - 'develop'
    paths: &paths
      # Production source, for the end-to-end group.
      - 'main.go'
      - 'cmd/**'
      - 'internal/**'
      - '!**_test.go'
      # The paths below match their test files again.
      - 'internal/torrentclient/**'
      - 'internal/daemontest/**'
      - 'internal/domain/**'
      - 'internal/errtrace/**'
      - 'internal/torrents/**'
      - 'test/harness/**'
      - 'test/e2e/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'ci.Dockerfile'
      - '.github/workflows/integration.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:
    inputs:
      full:
        description: 'Run all integration entries (run.sh list all)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup:
    name: Read entries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # paths-filter reads the changed files of a pull request through the API.
      pull-requests: read
    outputs:
      # A manual run starts both job groups.
      integration: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.integration == 'true' }}
      e2e: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.e2e-code == 'true' || steps.changes.outputs.e2e-other == 'true' }}
      integration-entries: ${{ steps.entries.outputs.integration-entries }}
      e2e-entries: ${{ steps.entries.outputs.e2e-entries }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter changed paths
        id: changes
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          # A push to develop compares with the commit before the push.
          base: ${{ github.ref_name }}
          # The negated path would also exclude test/e2e, so e2e-other lists it.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            integration:
              - 'internal/torrentclient/**'
              - 'test/harness/**'
              # Internal packages that the torrent client tests import.
              - 'internal/daemontest/**'
              - 'internal/domain/**'
              - 'internal/errtrace/**'
              - 'internal/torrents/**'
              - 'go.mod'
              - 'go.sum'
              # run.sh reads the Go test image from the release Dockerfile.
              - 'Dockerfile'
              - '.github/workflows/integration.yml'
            # The production source, including the files that Go embeds.
            e2e-code:
              - 'main.go'
              - 'cmd/**'
              - 'internal/**'
              - '!**/*_test.go'
            e2e-other:
              - 'test/harness/**'
              - 'test/e2e/**'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'
              # run.sh builds the seasonpackarr image from ci.Dockerfile.
              - 'ci.Dockerfile'
              - '.github/workflows/integration.yml'

      - name: List entries
        id: entries
        env:
          # Empty on push and pull_request events.
          FULL: ${{ inputs.full }}
          CHANGES: ${{ steps.changes.outputs.changes }}
        run: |
          echo "changed path filters: ${CHANGES:-none, manual run}"
          if [[ $FULL == true ]]; then
            integration_entries=$(test/harness/run.sh list all)
          else
            integration_entries=$(test/harness/run.sh list)
          fi
          e2e_entries=$(test/harness/run.sh list e2e)
          echo "integration entries: ${integration_entries}"
          echo "e2e entries: ${e2e_entries}"
          echo "integration-entries=${integration_entries}" >> "$GITHUB_OUTPUT"
          echo "e2e-entries=${e2e_entries}" >> "$GITHUB_OUTPUT"

  integration:
    name: ${{ matrix.entry }}
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.integration == 'true'
    timeout-minutes: 30
    strategy:
      # One failed entry must not cancel the others, so a run shows every broken version.
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.setup.outputs.integration-entries) }}
    env: &harness-env
      # Compose builds through bake on the buildx builder, which can export the GHA cache.
      COMPOSE_BAKE: 'true'
      # compose.deluge.yaml reads this to turn on the GHA layer cache.
      HARNESS_GHA_CACHE: '1'
    permissions: &harness-permissions
      contents: read
      packages: read
    steps: &harness-steps
      - name: Checkout
        uses: actions/checkout@v7

      # Anonymous GHCR pulls share a rate limit with every job on the runner's address.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # buildx reads the cache service URL and token from the ACTIONS_* variables,
      # which run steps do not get by default.
      - name: Expose GitHub runtime
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Run harness
        env:
          ENTRY: ${{ matrix.entry }}
        run: test/harness/run.sh "$ENTRY"

      - name: Upload daemon logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: daemon-logs-${{ matrix.entry }}
          path: test/harness/artifacts/${{ matrix.entry }}
          # A failure before the daemons start leaves no logs.
          if-no-files-found: warn

  # Same steps and cache as integration, because e2e-deluge builds the Deluge image.
  e2e:
    name: ${{ matrix.entry }}
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.e2e == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.setup.outputs.e2e-entries) }}
    env: *harness-env
    permissions: *harness-permissions
    steps: *harness-steps
